<label class="toggle-label block overflow-hidden h-6 rounded-full cursor-pointer relative transition-colors duration-200 ease-in-out" for="tracking-toggle">
<span class="absolute inset-0 rounded-full bg-outline-variant transition-colors duration-200"></span>
<span class="absolute left-[2px] top-[2px] bg-white w-5 h-5 rounded-full shadow-sm transition-transform duration-200 ease-in-out" style="transform: translateX(24px);"></span>

<!-- Inline JS for Toggle visual update (since standard CSS toggle hack can be finicky without explicit tailwind classes) -->
<script>
        const toggleInput = document.getElementById('tracking-toggle');
        const toggleTrack = toggleInput.nextElementSibling.querySelector('span:first-child');
        const toggleKnob = toggleInput.nextElementSibling.querySelector('span:last-child');

        function updateToggle() {
            if (toggleInput.checked) {
                toggleTrack.classList.remove('bg-outline-variant');
                toggleTrack.classList.add('bg-primary');
                toggleKnob.style.transform = 'translateX(24px)';
            } else {
                toggleTrack.classList.remove('bg-primary');
                toggleTrack.classList.add('bg-outline-variant');
                toggleKnob.style.transform = 'translateX(0)';
            }
        }

        toggleInput.addEventListener('change', updateToggle);
        // Initialize state
        updateToggle();
    </script>
