<div class="flex h-screen bg-[var(--color-bg)]">
  <aside
    class="rail flex w-20 flex-none flex-col items-center gap-3 bg-[var(--mat-sys-surface)] py-3"
  >
    <div class="mb-2 flex h-12 w-12 items-center justify-center">
      <mat-icon class="text-[var(--color-accent)]">trending_up</mat-icon>
    </div>

    <a
      routerLink="/dashboard"
      routerLinkActive="rail-item--active"
      class="rail-item"
      matRipple
    >
      <span class="rail-item__indicator">
        <mat-icon>dashboard</mat-icon>
      </span>
      <span class="rail-item__label">Dashboard</span>
    </a>

    <a
      routerLink="/channels"
      routerLinkActive="rail-item--active"
      class="rail-item"
      matRipple
    >
      <span class="rail-item__indicator">
        <mat-icon>subscriptions</mat-icon>
      </span>
      <span class="rail-item__label">Channels</span>
    </a>
  </aside>

  <div class="flex min-w-0 flex-1 flex-col">
    <mat-toolbar class="app-toolbar !bg-[var(--color-bg)] !px-4">
      <span class="flex-1 font-[family-name:var(--font-display)]">{{ pageTitle() }}</span>
      <span class="flex items-center gap-2 text-[var(--color-text-muted)]">
        <mat-icon class="!h-5 !w-5 !text-[20px]">sync</mat-icon>
        <span class="text-sm">Đồng bộ lần cuối: —</span>
      </span>
    </mat-toolbar>

    <main class="min-w-0 flex-1 overflow-y-auto p-4">
      <router-outlet />
    </main>
  </div>
</div>
