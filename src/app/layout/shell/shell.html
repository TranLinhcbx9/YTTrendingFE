<div class="flex h-screen bg-[var(--color-bg)]">
  <aside
    class="rail hidden w-20 flex-none flex-col items-center gap-3 bg-[var(--mat-sys-surface)] py-3 sm:flex"
  >
    <div
      class="mb-2 grid h-12 w-12 place-items-center rounded-[var(--mat-sys-corner-large)] bg-[var(--mat-sys-primary-container)] text-[var(--mat-sys-on-primary-container)]"
    >
      <mat-icon class="!h-6 !w-6 !text-[24px]">trending_up</mat-icon>
    </div>

    <a routerLink="/dashboard" routerLinkActive="rail-item--active" class="rail-item" matRipple>
      <span class="rail-item__indicator">
        <mat-icon>dashboard</mat-icon>
      </span>
      <span class="rail-item__label">Dashboard</span>
    </a>

    <a routerLink="/channels" routerLinkActive="rail-item--active" class="rail-item" matRipple>
      <span class="rail-item__indicator">
        <mat-icon>subscriptions</mat-icon>
      </span>
      <span class="rail-item__label">Channels</span>
    </a>

    <a routerLink="/sync-history" routerLinkActive="rail-item--active" class="rail-item" matRipple>
      <span class="rail-item__indicator">
        <mat-icon>history</mat-icon>
      </span>
      <span class="rail-item__label">Sync history</span>
    </a>
  </aside>

  <div class="flex min-w-0 flex-1 flex-col">
    <mat-toolbar class="app-toolbar">
      <div class="app-toolbar__identity">
        <button
          matIconButton
          class="mobile-menu-button"
          aria-label="Open navigation menu"
          (click)="drawer.toggle()"
        >
          <mat-icon>menu</mat-icon>
        </button>
        <span class="app-toolbar__title">{{ pageTitle() }}</span>
      </div>

      <div class="app-toolbar__actions">
        <button
          matButton="filled"
          type="button"
          class="app-toolbar__sync-button"
          aria-label="Sync all channels"
          [disabled]="syncHistoryStore.isActionRunning()"
          (click)="startSync()"
        >
          @if (syncHistoryStore.isActionRunning()) {
            <mat-progress-spinner diameter="18" mode="indeterminate" />
          } @else {
            <ng-container>
              <mat-icon>sync</mat-icon>
              <span class="app-toolbar__sync-label">Sync all</span>
            </ng-container>
          }
        </button>
        <span class="app-toolbar__last-sync">
          <span class="app-toolbar__sync-status" aria-hidden="true"></span>
          <span>Last synced: —</span>
        </span>
      </div>
    </mat-toolbar>

    <mat-sidenav-container class="app-sidenav-container flex-1">
      <mat-sidenav #drawer class="app-sidenav" mode="over" autoFocus="dialog">
        <nav class="drawer-nav">
          <a
            routerLink="/dashboard"
            routerLinkActive="drawer-item--active"
            class="drawer-item"
            (click)="drawer.close()"
          >
            <mat-icon>dashboard</mat-icon>
            <span>Dashboard</span>
          </a>
          <a
            routerLink="/channels"
            routerLinkActive="drawer-item--active"
            class="drawer-item"
            (click)="drawer.close()"
          >
            <mat-icon>subscriptions</mat-icon>
            <span>Channels</span>
          </a>
          <a
            routerLink="/sync-history"
            routerLinkActive="drawer-item--active"
            class="drawer-item"
            (click)="drawer.close()"
          >
            <mat-icon>history</mat-icon>
            <span>Sync history</span>
          </a>
        </nav>
      </mat-sidenav>

      <mat-sidenav-content class="app-sidenav-content">
        <main class="min-w-0 flex-1 overflow-y-auto px-4 py-4 sm:px-6 sm:py-6">
          <router-outlet />
        </main>
      </mat-sidenav-content>
    </mat-sidenav-container>
  </div>
</div>
