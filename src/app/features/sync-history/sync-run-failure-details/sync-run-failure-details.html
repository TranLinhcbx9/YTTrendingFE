@if (item(); as selected) {
  <section class="failure-details" [class.failure-details--sheet]="isBottomSheet()">
    <header class="failure-details__header">
      <div class="flex min-w-0 items-center gap-2">
        <mat-icon class="text-[var(--color-danger)]">troubleshoot</mat-icon>
        <span class="min-w-0 truncate font-[family-name:var(--font-display)] font-bold"
          >Channel result details</span
        >
      </div>
      <button matIconButton type="button" aria-label="Close failure details" (click)="dismiss()">
        <mat-icon>close</mat-icon>
      </button>
    </header>

    <div class="failure-details__body">
      <div class="flex flex-col gap-1">
        <span class="failure-details__label">Channel</span>
        <span class="font-medium text-[var(--color-text)]">{{ selected.channelName }}</span>
      </div>

      <div class="flex flex-col gap-1">
        <span class="failure-details__label">Status</span>
        <app-sync-status-chip [scope]="'item'" [status]="selected.status" />
      </div>

      <div class="flex flex-col gap-2">
        <span class="failure-details__label">Error trace</span>
        <div class="failure-details__trace">
          <code class="font-[family-name:var(--font-mono)] text-[var(--color-danger)]">
            {{ selected.errorCode ?? 'Unknown error' }}
          </code>
          <p>{{ selected.errorMessage ?? 'No error message was returned by the server.' }}</p>
        </div>
      </div>
    </div>

    <footer class="failure-details__footer">
      <button
        matButton="outlined"
        type="button"
        [disabled]="!selected.errorCode"
        (click)="copyErrorCode(selected.errorCode)"
      >
        <mat-icon>content_copy</mat-icon>
        Copy error code
      </button>
    </footer>
  </section>
}
