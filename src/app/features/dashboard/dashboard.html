<div class="flex flex-col gap-4">
  <app-video-filter-bar
    [channels]="store.channelOptions()"
    [filter]="store.filter()"
    (filterChange)="onFilterChange($event)"
  />

  <mat-tab-group
    [selectedIndex]="2"
    (selectedIndexChange)="selectedTab.set($event)"
    mat-align-tabs="start"
    mat-stretch-tabs="false"
    fitInkBarToContent
  >
    <mat-tab label="Trending Shorts" />
    <mat-tab label="Fast Growing" />
    <mat-tab label="Recent Shorts" />
    <mat-tab label="Saved Videos" />
  </mat-tab-group>

  @switch (selectedTab()) {
    @case (2) {
      @if (store.isLoading()) {
        <mat-progress-bar mode="indeterminate" class="!h-0.5" />
      }

      @if (store.loadError()) {
        <div class="flex items-center gap-2">
          <span class="text-[var(--color-danger)]">Failed to load the video list.</span>
          <button matButton type="button" (click)="store.reload()">Retry</button>
        </div>
      } @else if (store.items().length === 0 && !store.isLoading()) {
        <app-empty-state
          icon="video_library"
          title="No videos yet"
          message="Videos will appear after the next sync — or try loosening the filters above."
        />
      } @else {
        <div class="video-grid">
          @for (video of store.items(); track video.id) {
            <app-video-card [video]="video" />
          }
        </div>

        <mat-paginator
          [length]="store.totalCount()"
          [pageSize]="store.pageSize()"
          [pageIndex]="store.page() - 1"
          [hidePageSize]="true"
          (page)="onPageChange($event)"
        />
      }
    }
    @case (3) {
      <app-empty-state
        icon="bookmark"
        title="Saved ideas not available yet"
        message="This tab is waiting on the backend to open up the SavedIdeas API."
      />
    }
    @default {
      <app-empty-state
        icon="query_stats"
        title="No trending score data yet"
        message="Trending / Fast Growing need a score and growth snapshot — this tab will have data once the backend runs 2 full sync cycles and adds the field to VideoDto."
      />
    }
  }
</div>
