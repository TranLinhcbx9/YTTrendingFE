<div class="flex flex-col gap-4">
  <app-video-filter-bar
    [channels]="store.channelOptions()"
    [filter]="store.filter()"
    (filterChange)="onFilterChange($event)"
  />

  <mat-tab-group
    [selectedIndex]="2"
    (selectedIndexChange)="selectedTab.set($event)"
    mat-align-tabs="start"
    mat-stretch-tabs="false"
    fitInkBarToContent
  >
    <mat-tab label="Trending Shorts" />
    <mat-tab label="Fast Growing" />
    <mat-tab label="Recent Shorts" />
    <mat-tab label="Saved Videos" />
  </mat-tab-group>

  @switch (selectedTab()) {
    @case (2) {
      @if (store.isLoading()) {
        <mat-progress-bar mode="indeterminate" class="!h-0.5" />
      }

      @if (store.loadError()) {
        <div class="flex items-center gap-2">
          <span class="text-[var(--color-danger)]">Không tải được danh sách video.</span>
          <button matButton type="button" (click)="store.reload()">Thử lại</button>
        </div>
      } @else if (store.items().length === 0 && !store.isLoading()) {
        <app-empty-state
          icon="video_library"
          title="Chưa có video nào"
          message="Video sẽ xuất hiện sau lần đồng bộ kế tiếp — hoặc thử bỏ bớt bộ lọc phía trên."
        />
      } @else {
        <div class="grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5">
          @for (video of store.items(); track video.id) {
            <app-video-card [video]="video" />
          }
        </div>

        <mat-paginator
          [length]="store.totalCount()"
          [pageSize]="store.pageSize()"
          [pageIndex]="store.page() - 1"
          [hidePageSize]="true"
          (page)="onPageChange($event)"
        />
      }
    }
    @case (3) {
      <app-empty-state
        icon="bookmark"
        title="Chưa lưu được ý tưởng"
        message="Tab này chờ backend mở API SavedIdeas."
      />
    }
    @default {
      <app-empty-state
        icon="query_stats"
        title="Chưa có dữ liệu điểm trending"
        message="Trending / Fast Growing cần điểm và snapshot tăng trưởng — backend chạy đủ 2 chu kỳ đồng bộ và bổ sung field vào VideoDto thì tab này mới có dữ liệu."
      />
    }
  }
</div>
