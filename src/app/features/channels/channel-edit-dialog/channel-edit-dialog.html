<h2 mat-dialog-title>Edit channel</h2>

<mat-dialog-content class="flex flex-col gap-1">
  <app-clearable-input
    label="Channel name"
    [(value)]="name"
    [errorMessage]="store.formError()?.errors?.['name']?.[0] ?? null"
  />

  <app-clearable-input
    label="URL"
    [(value)]="url"
    [errorMessage]="store.formError()?.errors?.['url']?.[0] ?? null"
  />

  @if (store.formErrorMessage(); as msg) {
    <small class="text-[var(--color-danger)]">{{ msg }}</small>
  }

  <div class="flex items-center gap-2 py-1">
    <mat-slide-toggle [checked]="isEnabled()" (change)="isEnabled.set($event.checked)">
      Tracking enabled
    </mat-slide-toggle>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button matButton mat-dialog-close [disabled]="store.isSubmitting()">Cancel</button>
  <button matButton="filled" (click)="onSave()" [disabled]="store.isSubmitting()">
    @if (store.isSubmitting()) {
      <mat-progress-spinner diameter="18" mode="indeterminate" />
    } @else {
      Save
    }
  </button>
</mat-dialog-actions>
