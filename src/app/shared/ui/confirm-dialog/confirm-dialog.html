<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>{{ data.message }}</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton mat-dialog-close>{{ data.cancelLabel ?? 'Huỷ' }}</button>
  <button matButton="filled" (click)="confirm()">{{ data.confirmLabel ?? 'Xác nhận' }}</button>
</mat-dialog-actions>
