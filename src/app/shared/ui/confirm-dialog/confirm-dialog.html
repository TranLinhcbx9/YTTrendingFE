<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  @if (data.tone === 'danger') {
    <p class="confirm-dialog__warning" role="alert">
      This action permanently removes the channel and its tracked videos.
    </p>
  }
  <p>{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton mat-dialog-close [disabled]="isSubmitting()">
    {{ data.cancelLabel ?? 'Cancel' }}
  </button>
  <button
    matButton="filled"
    [class.confirm-dialog__action--danger]="data.tone === 'danger'"
    [disabled]="isSubmitting()"
    (click)="confirm()"
  >
    @if (isSubmitting()) {
      <mat-progress-spinner diameter="18" mode="indeterminate" />
    } @else {
      {{ data.confirmLabel ?? 'Confirm' }}
    }
  </button>
</mat-dialog-actions>
